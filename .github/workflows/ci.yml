name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

# Least-privilege default: nothing is granted unless a job needs it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: Lint, test, dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      # SAST-style scan for common JS security issues (secrets, unsafe
      # patterns) in addition to npm audit's dependency-CVE scan.
      - name: Trivy filesystem scan (source + deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker-build-scan:
    name: Build image & scan for vulnerabilities
    runs-on: ubuntu-latest
    needs: app-quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed - CI only validates it builds & is clean)
        run: docker build -t ci-scan-image:${{ github.sha }} ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-scan-image:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Fails the build if a secret was accidentally baked into a layer.
      - name: Scan image for embedded secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-scan-image:${{ github.sha }}
          scanners: secret
          exit-code: '1'

  terraform-checks:
    name: terraform fmt / validate / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'

      - name: terraform fmt (check only, no rewrite)
        run: terraform fmt -check -recursive ..

      # No backend/credentials in CI for `validate` - we don't want CI
      # runners touching real state. Validate is purely syntactic/type
      # checking against a local, throwaway backend.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: tflint init
        run: tflint --init
        working-directory: terraform

      - name: tflint
        run: tflint --recursive
        working-directory: terraform

      # Policy-as-code scan for common IaC misconfigurations
      # (public buckets, overly-broad IAM, missing encryption, etc).
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
